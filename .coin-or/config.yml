Description:
  Slug: Couenne
  ShortName: Couenne
  LongName: Convex Over and Under ENvelopes for Nonlinear Estimation
  ShortDescription: A solver for finding global optima of nonconvex mixed integer nonlinear optimization problems (MINLPs).
  LongDescription: |2
    Couenne (Convex Over and Under ENvelopes for Nonlinear Estimation) is
    a spatial branch-and-bound algorithm that implements linearization,
    bound reduction, and branching techniques for Mixed-Integer Nonlinear
    Programming (MINLP) problems. The purpose of Couenne is to find global
    optima of nonconvex MINLPs. It builds on top of Bonmin, Cbc, and Ipopt.
  Manager: Pietro Belotti
  Homepage: https://github.com/coin-or/Couenne
  License: Eclipse Public License 1.0
  LicenseURL: http://www.opensource.org/licenses/eclipse-1.0
  Zenodo:
  IncludedIn:
    Package: Couenne
  Language:
    - C++
  Categories:
    - Optimization deterministic nonlinear nonconvex mixed-integer
  PaperCite: https://doi.org/10.1080/10556780903087124

